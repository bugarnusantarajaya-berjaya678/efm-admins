<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EFM Portal — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1E1C43;
      --navy2:  #2D2B5A;
      --orange: #E05945;
      --orange-hover: #C94A38;
      --white:  #FFFFFF;
      --gray-bg: #F8F9FA;
      --gray-border: #E2E6EA;
      --gray-text: #6C757D;
      --text-dark: #1E1C43;
      --shadow: 0 8px 32px rgba(30,28,67,0.18);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(224,89,69,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(45,43,90,0.6) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Decorative circles */
    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.04);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    /* Logo area */
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: var(--navy);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: var(--white);
    }

    .logo-area h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.3px;
    }

    .logo-area p {
      font-size: 13px;
      color: var(--gray-text);
      margin-top: 4px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--gray-border);
      margin-bottom: 28px;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-text);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      width: 16px;
      height: 16px;
      color: var(--gray-text);
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid var(--gray-border);
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--gray-bg);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrap input:focus {
      border-color: var(--navy);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(30,28,67,0.08);
    }

    .input-wrap input::placeholder {
      color: #BFC5CC;
    }

    /* Password toggle */
    .toggle-pass {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      color: var(--gray-text);
      transition: color 0.2s;
    }

    .toggle-pass:hover { color: var(--navy); }
    .toggle-pass svg { width: 16px; height: 16px; }

    /* Forgot */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .forgot-row a {
      font-size: 12px;
      color: var(--orange);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-row a:hover { text-decoration: underline; }

    /* Checkbox */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--navy);
      cursor: pointer;
    }

    .checkbox-row label {
      font-size: 13px;
      color: var(--gray-text);
      cursor: pointer;
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(224,89,69,0.3);
    }

    .btn-login:hover {
      background: var(--orange-hover);
      box-shadow: 0 6px 20px rgba(224,89,69,0.4);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Error message */
    .error-msg {
      display: none;
      background: #FFF0EE;
      border: 1px solid #FFCAC4;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #C0392B;
      margin-bottom: 16px;
      text-align: center;
    }

    .error-msg.show { display: block; }

    /* Loading state */
    .btn-login .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Support link */
    .support-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray-text);
    }

    .support-link a {
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
    }

    .support-link a:hover { text-decoration: underline; }

    /* Footer */
    .card-footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-border);
      font-size: 11px;
      color: #BFC5CC;
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo-area">
      <img src="assets/white-logo-circle-pure.png" style="width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:16px;background:#1E1C43;padding:4px;"/>
      <h1>EFM Portal Login</h1>
      <p>Secure access for authorized personnel only.</p>
    </div>

    <div class="divider"></div>

    <!-- Error message -->
    <div class="error-msg" id="errorMsg">
      Username atau password salah. Coba lagi.
    </div>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pass" onclick="togglePassword()" id="toggleBtn" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="forgot-row">
          <a href="#">Forgot password?</a>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="remember" name="remember"/>
        <label for="remember">Keep me logged in</label>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="btnText">LOGIN</span>
        <div class="spinner" id="spinner"></div>
      </button>

    </form>

    <div class="support-link">
      Need assistance? <a href="mailto:essentialfitnessmanagement@gmail.com">Contact Support</a>
    </div>

    <div class="card-footer">
      © 2026 EFM MANAGEMENT SYSTEMS
    </div>

  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById('password');
      const icon  = document.getElementById('eyeIcon');
      const isHidden = input.type === 'password';

      input.type = isHidden ? 'text' : 'password';
      icon.innerHTML = isHidden
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }

    // Handle login
    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const btnText  = document.getElementById('btnText');
      const spinner  = document.getElementById('spinner');
      const errorMsg = document.getElementById('errorMsg');

      // Hide error
      errorMsg.classList.remove('show');

      // Loading state
      btn.disabled  = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';

      try {
        // TODO: Ganti API_URL dengan URL Google Apps Script deployment
        const API_URL = 'YOUR_APPS_SCRIPT_URL_HERE';

        const res  = await fetch(`${API_URL}?action=login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          // Simpan session
          const cookieExpiry = new Date();
          cookieExpiry.setHours(cookieExpiry.getHours() + 8);
          document.cookie = `efm_token=${data.token}; expires=${cookieExpiry.toUTCString()}; path=/; SameSite=Strict`;
          document.cookie = `efm_role=${data.role}; expires=${cookieExpiry.toUTCString()}; path=/; SameSite=Strict`;
          document.cookie = `efm_nama=${data.nama}; expires=${cookieExpiry.toUTCString()}; path=/; SameSite=Strict`;

          // Redirect berdasarkan role
          if (data.role === 'owner') {
            window.location.href = 'dashboard-owner.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } else {
          errorMsg.classList.add('show');
          btn.disabled = false;
          btnText.style.display = 'block';
          spinner.style.display = 'none';
        }
      } catch (err) {
        // Development mode: skip API, langsung ke dashboard
        console.warn('API not connected. Dev mode redirect.');
        window.location.href = 'dashboard-owner.html';
      }
    }
  </script>

</body>
</html>
